<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>சுதா காய்கறி கடை</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 12px;
  background: #f1f8f2;
  color: #26352a;
  font-family: Arial, sans-serif;
  font-size: 16px;
}

button, input, select, textarea {
  font: inherit;
}

button {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  cursor: pointer;
}

.app-header {
  background: #16834a;
  color: white;
  padding: 18px 12px;
  border-radius: 16px;
  text-align: center;
  margin-bottom: 14px;
}

.logo {
  font-size: 42px;
  margin-bottom: 5px;
}

.app-header h1 {
  font-size: 25px;
  margin: 5px 0;
}

.app-header p {
  margin: 5px 0 0;
  font-size: 14px;
}

.top-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.top-controls button {
  background: white;
  color: #176b3d;
  border: 1px solid #c8dfce;
  font-weight: bold;
}

.card {
  background: white;
  padding: 16px;
  margin-bottom: 14px;
  border-radius: 14px;
  box-shadow: 0 2px 7px #00000010;
}

.card h2 {
  font-size: 19px;
  margin: 0 0 14px;
  color: #176b3d;
}

.voice-button {
  display: block;
  width: 100%;
  background: #7542b8;
  color: white;
  font-size: 19px;
  font-weight: bold;
  padding: 17px;
  border-radius: 14px;
}

.voice-button:active {
  opacity: 0.8;
}

.voice-status {
  text-align: center;
  color: #526457;
  margin: 12px 0;
  font-size: 14px;
}

.voice-text {
  width: 100%;
  min-height: 75px;
  padding: 12px;
  border: 1px solid #cbd9ce;
  border-radius: 10px;
  background: #f8fbf8;
  resize: vertical;
}

.help-text {
  font-size: 13px;
  color: #657468;
  line-height: 1.7;
}

.section-title {
  color: #176b3d;
  font-weight: bold;
  font-size: 17px;
}

.hidden {
  display: none !important;
}

@media print {
  body {
    background: white;
  }
}
</style>
</head>

<body>

<!-- முகப்புப் பக்கம் -->

<main id="homePage">

  <header class="app-header">
    <div class="logo">🧺🥕🍅</div>
    <h1>சுதா காய்கறி கடை</h1>
    <p>குரல் மூலம் எளிய பில்லிங்</p>
  </header>

  <div class="top-controls">
    <button onclick="showAdmin()">
      ⚙️ நிர்வாகம்
    </button>

    <button onclick="changeFont(1)">
      🔠 எழுத்து அளவு +
    </button>
  </div>

  <!-- குரல் மூலம் பொருட்களைச் சேர்க்கும் பகுதி -->

  <section class="card">
    <h2>🎙️ குரல் மூலம் காய்கறிகளைச் சேர்க்க</h2>

    <button
      class="voice-button"
      onclick="startVoice()"
    >
      🎙️ பேசத் தொடங்கு
    </button>

    <p id="voiceStatus" class="voice-status">
      பேசத் தயாராக உள்ளது
    </p>

    <p class="section-title">நீங்கள் பேசியது:</p>

    <textarea
      id="voiceText"
      class="voice-text"
      placeholder="நீங்கள் பேசுவது இங்கே வரும்..."
    ></textarea>

    <p class="help-text">
      உதாரணம்: அரை கிலோ தக்காளி 60,
      ஒரு கிலோ கேரட் 80.
      கால் கிலோ, அரை கிலோ, முக்கால் கிலோ,
      ஒரு கிலோ என்று பேசலாம்.
    </p>
  </section>

<!-- பகுதி 2 இங்கே தொடரும் -->
